[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-manager"
version = "0.1.0"
description = "Publicação controlada de scripts Lua"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ts = "ts_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
