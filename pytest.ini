[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: Mutagen real, local, sem SSH (pytest -m integration)
    ssh: Mutagen + OpenSSH reais contra contêiner Docker linux/arm64 (pytest -m ssh)
    remote: VM ARM64 real; exige TSM_REMOTE_* (pytest -m remote)
timeout = 120
timeout_method = thread
