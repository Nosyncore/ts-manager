[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tsm-server"
version = "0.2.0"
description = "TS Manager — servidor (Git interno, publicação, shared e API)"
requires-python = ">=3.12"
dependencies = [
  "tsm-common==0.2.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[project.scripts]
tsm-manager = "tsm_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["tsm_manager", "tsm_common"]
