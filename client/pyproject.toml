[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tsm-client"
version = "0.1.0"
description = "TS Manager — Client (núcleo, CLI e adaptador Mutagen)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
tsm = "tsm_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tsm_client"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF043", "RUF059"]
